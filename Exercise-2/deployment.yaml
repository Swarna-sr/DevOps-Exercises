apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flask-app
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  strategy: {}
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - image: flask-k8s-app:latest
        imagePullPolicy: Never
        name: flask-k8s-app
        ports:
        - containerPort: 5000
        resources: {}
status: {}
